apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.agent.session
spec:
  prefix: SES
  code: ses
  children: [agent.turn]
  lifecycle:
    defaultStatus: agent.active
    transitions:
      - from: agent.active
        to: [agent.archived]
      - from: agent.archived
        to: []
  sections:
    must: [model]
    should: [summary, usage]
  whenToCreate: |
    Create a agent.session artifact to record a complete agent session — one
    session per agent run. Carries model identity, token usage, and a
    summary of what the agent accomplished. Child agent.turn artifacts hold
    the individual message exchanges.
  agentNote: |
    Session artifacts are the provenance layer. They answer "who did this,
    with what model, when, and at what cost." Link sessions to the tasks
    and specs they produced via produced_by edges.
