apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.agent.tool-call
spec:
  children: []
  lifecycle:
    defaultStatus: agent.active
    transitions:
      - from: agent.active
        to: [agent.archived]
      - from: agent.archived
        to: []
  sections:
    must: [input]
    should: [output]
  whenToCreate: |
    Create a agent.tool-call artifact for each tool invocation within a session
    turn. Carries the tool name, input parameters, and output. Links back to
    artifacts created or modified by the tool call via produced_by edges.
  agentNote: |
    Tool calls are the bridge between agent reasoning and artifact mutations.
    A tool_call that creates a task should have a produced_by edge to that task.
    This makes the provenance chain complete: session → turn → tool_call → artifact.
