apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.agent.turn
spec:
  prefix: TRN
  code: trn
  children: [agent.tool-call]
  lifecycle:
    defaultStatus: agent.active
    transitions:
      - from: agent.active
        to: [agent.archived]
      - from: agent.archived
        to: []
  sections:
    must: [content]
  whenToCreate: |
    Create a agent.turn artifact for each message exchange in an agent session.
    One turn = one user message + one assistant response. The role (user or
    assistant) is a label. Tool calls are child agent.tool-call artifacts.
  agentNote: |
    Turns are children of their session. They carry the raw content of the
    exchange and link to any tool calls made during that turn via parent_of.
