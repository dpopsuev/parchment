# worker_id_required — formerly triggered on to=allocated AND kind=task.
# The allocated/in_progress/in_review statuses were removed in the work.* lifecycle migration.
# This rule is inactive (status _never_ does not exist).
name: worker_id_required
trigger: status_changed
when: to=_never_
action: block
forceable: true
check: worker_id_required
message: "worker_id required in extra before activation — set extra.worker_id to the agent or operator ID"
