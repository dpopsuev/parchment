apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.knowledge.concept
spec:
  children: []
  lifecycle:
    defaultStatus: work.active
  sections:
    should: [definition, examples]
  whenToCreate: |
    Create a concept to define a domain term or abstract idea that recurs across
    multiple notes and discussions. Concepts are atomic — one idea per artifact.
  agentNote: |
    Notes elaborate concepts. Concepts anchor the knowledge graph. Use sparingly —
    only create a concept when a term needs a canonical definition.
