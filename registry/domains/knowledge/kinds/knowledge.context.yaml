apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.knowledge.context
spec:
  protected: true
  children: []
  lifecycle:
    defaultStatus: work.active
  sections:
    should: [content, scope, confidence]
  relations:
    outgoing: [remembers]
  whenToCreate: |
    Create a context artifact to store persistent agent memory about a person,
    project, or workflow — things that should survive across sessions.
  agentNote: |
    Context artifacts are protected They bookmark notes via
    the remembers relation. scope and confidence sections help future agents
    assess reliability.
