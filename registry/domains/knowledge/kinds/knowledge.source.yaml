apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.knowledge.source
spec:
  children: []
  recallable: true
  recallWeight: 1.1
  lifecycle:
    defaultStatus: work.active
  sections:
    must: [summary]
    should: [key-insights, provenance]
  relations:
    incoming: [cites]
  whenToCreate: |
    Create a source to capture an external reference — a paper, article, book,
    URL, or dataset. Sources are cited by notes and concepts.
  agentNote: |
    Sources are the citation anchors of the knowledge graph. summary is required.
    provenance should contain the URL or publication reference.
