apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.support.section
spec:
  skipEmptyCheck: true
  children: ["*"]
  lifecycle:
    defaultStatus: work.active
  whenToCreate: |
    Section artifacts are synthetic — derived from artifact sections via the
    art_id#section_name addressing scheme. Do not create directly.
  agentNote: |
    Internal synthetic kind. Used for section-level addressing and wikilink
    resolution. children=["*"] means any kind can nest under a section.
