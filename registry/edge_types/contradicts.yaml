apiVersion: scribe/v1
kind: EdgeType
metadata:
  name: contradicts
spec:
  directionality: symmetric
  whenToUse: |
    Use contradicts when two notes document a genuine disagreement. Symmetric:
    A contradicts B implies B contradicts A.
  semantics: |
    Symmetric disagreement marker. Surfaced by knowledge lint as a tension to
    resolve. Does not block anything.
