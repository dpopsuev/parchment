apiVersion: scribe/v1
kind: EdgeTypeDefinition
metadata:
  name: justifies
spec:
  whenToUse: |
    Use justifies when a spec, goal, or task provides the rationale for another
    artifact — a goal justifies a campaign, a spec justifies a task, a need
    justifies a spec.
  semantics: |
    Rationale chain. Used in briefing traversal to show the "why" behind a piece
    of work. admin(action=set_goal) automatically creates a justifies link from
    the root spec to the new goal.
