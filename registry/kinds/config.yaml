apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.config
spec:
  prefix: CFG
  code: CFG
  family: support
  protected: true
  children: []
  whenToCreate: |
    Config artifacts store runtime configuration for Scribe — sticky filter
    defaults, scope settings. Not for user-facing content.
  agentNote: |
    Internal kind. Managed by Protocol.GetConfig/SetConfig. Do not create
    config artifacts manually unless you are configuring scope defaults.
