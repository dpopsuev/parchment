name: context
prefix: CTX
code: "x"
family: knowledge
protected: true
lifecycle:
  default_status: work.active
sections:
  should: [content, scope, confidence]
relations:
  outgoing: [remembers]
children: []
when_to_create: |
  Create a context artifact to store persistent agent memory about a person,
  project, or workflow — things that should survive across sessions.
agent_note: |
  Context artifacts are protected (not vacuumable). They bookmark notes via
  the remembers relation. scope and confidence sections help future agents
  assess reliability.
