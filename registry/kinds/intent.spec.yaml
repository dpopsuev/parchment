apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.intent.spec
spec:
  prefix: SPEC
  code: SPC
  protected: true
  requiresImplementation: true
  children: []
  lifecycle:
    defaultStatus: work.draft
    transitions:
      - from: work.draft
        to: [decision.proposed, cancelled]
      - from: decision.proposed
        to: [decision.accepted, decision.rejected, decision.deferred, work.draft]
      - from: decision.accepted
        to: [archived]
      - from: decision.rejected
        to: []
      - from: decision.deferred
        to: [work.draft]
      - from: cancelled
        to: []
  activationRequiresSections: true
  sections:
    must: [problem]
    should: [intent.decision, acceptance]
    could: [architecture, current_architecture, desired_architecture]
  relations:
    incoming: [implements, justifies]
    outgoing: [satisfies]
    targets:
      satisfies: [support.template]
  whenToCreate: |
    Create a spec when you need to design something before building it —
    interface contracts, data models, architectural decisions, or any work where
    the "what" must be agreed before the "how" begins.
  agentNote: |
    Specs are intent artifacts (desired state). Tasks implement specs. A spec
    without implementing tasks is unowned work. Lifecycle: work.draft → decision.proposed →
    decision.accepted (immutable). Once accepted, content is authoritative.
