name: journal
prefix: JRN
code: "j"
family: knowledge
lifecycle:
  default_status: active
sections:
  should: [body]
relations:
  outgoing: [cites, documents]
children: []
when_to_create: |
  Create a journal entry for a daily dated record — one per day, idempotent.
  Use for session summaries, daily notes, and time-bound observations.
agent_note: |
  One journal per day. Creating the same date twice is a no-op. Journal entries
  cite sources and document artifacts but do not define concepts.
