apiVersion: scribe/v1
kind: Label
metadata:
  name: kind.support.ref
spec:
  prefix: REF
  code: REF
  protected: true
  skipEmptyCheck: true
  children: []
  sections:
    should: [summary, knowledge.source]
  relations:
    outgoing: [documents, satisfies]
    expectedOutgoing: [documents]
    targets:
      satisfies: [support.template]
  whenToCreate: |
    Create a ref to link an external source (paper, blog post, RFC, documentation)
    into the artifact graph. Refs provide citeable provenance for notes and specs.
  agentNote: |
    Refs are support artifacts — they document other artifacts. A ref without a
    documents edge is an orphan; lint surfaces this. source section should contain
    the URL or citation.
