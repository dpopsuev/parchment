apiVersion: scribe/v1
kind: LabelDefinition
metadata:
  name: always
spec:
  alwaysApply: true
  whenToApply: |
    Apply "always" to rules or context notes that must be included in every
    agent context assembly, regardless of scope or query.
  implies: |
    Bypasses eviction and recency filtering. The artifact is always present
    in context_read output.
