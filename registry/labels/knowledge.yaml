apiVersion: scribe/v1
kind: Label
metadata:
  name: knowledge
spec:
  evictionPolicy: protected
  halfLifeDays: 180
  whenToApply: |
    Apply "knowledge" to notes that encode domain facts, concepts, or reference
    material that should survive beyond the session that created them.
  implies: |
    Protected from eviction for 180 days. Included in evergreen knowledge queries.
    Not auto-evicted by the structural heat algorithm.
