apiVersion: scribe/v1
kind: LabelDefinition
metadata:
  name: rule
spec:
  world: behavioral
  evictionPolicy: protected
  whenToApply: |
    Apply "rule" to notes that encode behavioral constraints — coding standards,
    commit policies, naming conventions, process gates. These are the agent's
    operating procedure.
  implies: |
    Protected from eviction. Included in context_read as behavioral rules.
    Dot-namespaced: "rule.security" inherits "rule".
