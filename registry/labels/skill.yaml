apiVersion: scribe/v1
kind: LabelDefinition
metadata:
  name: skill
spec:
  world: behavioral
  evictionPolicy: protected
  whenToApply: |
    Apply "skill" to notes that encode procedural knowledge — how to do X,
    step-by-step instructions, reusable procedures. Skills are the agent's
    procedural memory.
  implies: |
    Protected from eviction. Included in context_read as procedural guidance.
    Searchable via recall(query="how to X").
